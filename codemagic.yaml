workflows:
  android-workflow:
    name: Build Android APK
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Find and Build Flutter APK
        script: |
          # اگر پروجیکٹ ذیلی فولڈر میں ہے تو خود بخود اس میں جا کر بلڈ کرے
          if [ -d "kharcha_dost_app" ]; then
            cd kharcha_dost_app
          fi
          flutter packages pub get
          flutter build apk --release
    artifacts:
      - "**/build/**/outputs/**/*.apk"
    publishing:
      email:
        recipients:
          - user@example.com
        notify:
          success: true
          failure: false
